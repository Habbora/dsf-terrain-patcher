name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x64
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: python -m pip install "pywebview[pyside6]==6.2.1"
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: python -m PyInstaller --noconfirm OsmTerreno.spec
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then platform=mac; else platform=lin; fi
          chmod +x "dist/OsmTerreno/tools/$platform/tools/DSFTool"
      - name: Verificar o executável empacotado
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          package = Path("dist/OsmTerreno").resolve()
          executable = package / ("OsmTerreno.exe" if os.name == "nt" else "OsmTerreno")
          triangle = [[0, 0, 0], [1, 0, 0], [0, 1, 0]]
          header = {"clips": [], "region": "POLYGON EMPTY", "quality": False}
          batch = {"triangulos": [triangle, triangle]}
          request = "\n".join(map(json.dumps, [header, triangle, batch])) + "\n"
          run = subprocess.run([str(executable), "--cortar"], input=request,
                               capture_output=True, text=True, timeout=60, cwd=package)
          if run.returncode:
              raise RuntimeError(run.stderr or run.stdout or f"Exit {run.returncode}")
          assert [json.loads(line) for line in run.stdout.splitlines()] == [
              [triangle], [[triangle], [triangle]]
          ]
          PY
      - name: Gerar pacote
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          name="OsmTerreno-${GITHUB_REF_NAME//\//-}-$PLATFORM"
          mkdir -p release
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -m zipfile -c "release/$name.zip" dist/OsmTerreno
          else
            tar -czf "release/$name.tar.gz" -C dist OsmTerreno
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publicar no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          options=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes "${options[@]}"
